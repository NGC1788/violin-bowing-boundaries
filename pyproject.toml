[project]
name = "violin-bowing-boundaries"
version = "0.1.0"
description = "Measurement and prediction of violin bowing boundaries: research infrastructure"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "torchaudio==2.11.0",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "pyarrow>=18",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "soundfile>=0.13,<1",
  "librosa>=0.11,<1",
  "opencv-python-headless>=4.10,<5",
  "imageio>=2.36,<3",
  "imageio-ffmpeg>=0.6,<1",
  "gpytorch>=1.14,<2",
  "jupyterlab>=4.3,<5",
  "ipykernel>=6.29,<8",
  "pyyaml>=6,<7",
  "pyserial>=3.5,<4",
  "tqdm>=4.67,<5",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
